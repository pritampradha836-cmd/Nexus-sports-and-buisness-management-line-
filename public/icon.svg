<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Satellite Orbit & Coordinate Grid Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="256" cy="256" rx="200" ry="85" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.5" transform="rotate(-30 256 256)"/>

  <!-- Central Amnetek Hexagon / Microchip Core -->
  <polygon points="256,128 366,192 366,320 256,384 146,320 146,192" fill="#041f1a" stroke="url(#emeraldGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Geometric 'A' letterform and Compute Node Lattice -->
  <path d="M 256 160 L 336 330 L 298 330 L 280 290 L 232 290 L 214 330 L 176 330 Z M 256 220 L 240 262 L 272 262 Z" fill="url(#emeraldGrad)"/>

  <!-- Satellite GNSS SV Node -->
  <circle cx="410" cy="180" r="10" fill="#38bdf8" filter="url(#glow)"/>
  <line x1="366" y1="192" x2="410" y2="180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Pulse status indicator -->
  <circle cx="256" cy="384" r="8" fill="#34d399"/>
</svg>
